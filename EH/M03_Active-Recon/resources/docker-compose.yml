# Opsi B (Alternatif Ringan) - Bab 3
#
# CATATAN PENTING: Ini BUKAN image resmi Rapid7. Ini adalah image komunitas
# yang mereplikasi sebagian besar service vulnerable-by-design ala Metasploitable2
# dalam bentuk container, cocok untuk laptop dengan resource terbatas.
#
# Untuk pengalaman paling otentik (dan untuk latihan DNS zone transfer di Bagian 3.4
# modul praktikum), gunakan Opsi A (VirtualBox + import_metasploitable2.sh) jika
# memungkinkan, karena BIND DNS server yang rentan adalah bagian dari image resmi.

services:
  metasploitable2-lite:
    image: tleemcjr/metasploitable2
    container_name: metasploitable2-lite
    restart: unless-stopped
    ports:
      - "21:21"
      - "22:22"
      - "23:23"
      - "25:25"
      - "80:80"
      - "139:139"
      - "445:445"
      - "3306:3306"
      - "5432:5432"
      - "161:161/udp"
    networks:
      - labnet

networks:
  labnet:
    driver: bridge
    internal: false   # set true untuk isolasi total tanpa akses internet dari container
