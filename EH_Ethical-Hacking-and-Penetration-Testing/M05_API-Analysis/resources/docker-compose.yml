services:
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - labnet

  webgoat:
    image: webgoat/webgoat
    container_name: webgoat
    restart: unless-stopped
    ports:
      - "8082:8080"
      - "9090:9090"   # WebWolf, companion app WebGoat untuk simulasi phishing/callback
    environment:
      - WEBGOAT_HOST=0.0.0.0
      - WEBGOAT_PORT=8080
      - WEBWOLF_HOST=0.0.0.0
      - WEBWOLF_PORT=9090
    networks:
      - labnet

networks:
  labnet:
    driver: bridge
    internal: false   # set true untuk isolasi total tanpa akses internet dari container
